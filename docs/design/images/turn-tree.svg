<svg xmlns="http://www.w3.org/2000/svg" class="s" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="Icicle chart: the session split into prompts, then main agent versus subagents, then by tool">
<style>
  .s { --surface:#ffffff; --ink:#1f2328; --muted:#59636e; --grid:#d1d9e0;
       --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --warn:#9a6700; --neutral:#8c959f; --neutral-2:#d0d7de; }
  @media (prefers-color-scheme: dark) {
    .s { --surface:#0d1117; --ink:#e6edf3; --muted:#9198a1; --grid:#3d444d;
         --c1:#3987e5; --c2:#d95926; --c3:#199e70; --warn:#d29922; --neutral:#6e7681; --neutral-2:#30363d; }
  }
  .bg { fill: var(--surface); }
  .t  { fill: var(--ink); font: 12px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .tm { fill: var(--muted); font: 11px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .th { fill: var(--ink); font: 600 14px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
  .rule { stroke: var(--ink); stroke-width: 1; opacity: .55; shape-rendering: crispEdges; }
  .c1 { fill: var(--c1); } .c2 { fill: var(--c2); } .c3 { fill: var(--c3); }
  .warnf { fill: var(--warn); } .warns { stroke: var(--warn); }
  .neutral { fill: var(--neutral); } .neutral2 { fill: var(--neutral-2); }
  .gap { stroke: var(--surface); stroke-width: 2; }
</style><rect class="bg" width="900" height="290" rx="6"/><text class="th" x="24" y="26">Where the tokens went: session 7f3a (synthetic)</text><text class="tm" x="24" y="44">Width is tokens. Session, then prompts, then who did the work, then what the work was. Click a block to zoom in.</text><rect class="neutral2" x="25.0" y="64" width="850.0" height="46" rx="3"/><text class="t" x="31.0" y="83">Session 7f3a</text><text class="tm" x="31.0" y="99">39.2M tokens · 10 prompts · 2h</text><rect class="neutral2" x="25.0" y="116" width="8.7" height="46" rx="3"/><rect class="neutral2" x="25.0" y="168" width="8.7" height="46" rx="3"/><rect class="neutral2" x="35.7" y="116" width="28.4" height="46" rx="3"/><rect class="neutral2" x="35.7" y="168" width="28.4" height="46" rx="3"/><rect class="neutral2" x="66.0" y="116" width="17.3" height="46" rx="3"/><rect class="neutral2" x="66.0" y="168" width="17.3" height="46" rx="3"/><rect class="neutral2" x="85.3" y="116" width="75.7" height="46" rx="3"/><text class="t" x="91.3" y="135">P4</text><text class="tm" x="91.3" y="151">3.6M</text><rect class="neutral2" x="85.3" y="168" width="50.8" height="46" rx="3"/><text class="t" x="91.3" y="187">main</text><rect class="neutral" x="138.1" y="168" width="22.9" height="46" rx="3"/><rect class="neutral2" x="163.0" y="116" width="463.6" height="46" rx="3"/><text class="t" x="169.0" y="135">P5</text><text class="tm" x="169.0" y="151">21.4M</text><path class="warnf" d="M619.6127526568034,126 l5.5,9.5 h-11 z"/><text class="t" x="610.6127526568034" y="135" text-anchor="end">runaway</text><rect class="neutral2" x="163.0" y="168" width="463.6" height="46" rx="3"/><text class="t" x="169.0" y="187">main agent</text><rect class="neutral2" x="163.0" y="220" width="156.3" height="46" rx="3"/><text class="t" x="169.0" y="239">File edit</text><text class="tm" x="169.0" y="255">≈ 7.3M</text><rect class="neutral2" x="321.3" y="220" width="109.7" height="46" rx="3"/><text class="t" x="327.3" y="239">Tests and builds</text><text class="tm" x="327.3" y="255">≈ 5.1M</text><rect class="neutral2" x="433.1" y="220" width="72.5" height="46" rx="3"/><text class="t" x="439.1" y="239">Script</text><text class="tm" x="439.1" y="255">≈ 3.4M</text><rect class="neutral2" x="507.6" y="220" width="72.5" height="46" rx="3"/><text class="t" x="513.6" y="239">File read</text><text class="tm" x="513.6" y="255">≈ 3.4M</text><rect class="neutral2" x="582.1" y="220" width="44.6" height="46" rx="3"/><text class="t" x="588.1" y="239">other</text><rect class="neutral2" x="628.6" y="116" width="62.5" height="46" rx="3"/><text class="t" x="634.6" y="135">P6</text><text class="tm" x="634.6" y="151">3.0M</text><rect class="neutral2" x="628.6" y="168" width="48.3" height="46" rx="3"/><text class="t" x="634.6" y="187">main</text><rect class="neutral" x="679.0" y="168" width="12.2" height="46" rx="3"/><rect class="neutral2" x="693.2" y="116" width="112.7" height="46" rx="3"/><text class="t" x="699.2" y="135">P7</text><text class="tm" x="699.2" y="151">5.3M</text><rect class="neutral2" x="693.2" y="168" width="112.7" height="46" rx="3"/><text class="t" x="699.2" y="187">main agent</text><rect class="neutral2" x="807.9" y="116" width="20.3" height="46" rx="3"/><rect class="neutral2" x="807.9" y="168" width="20.3" height="46" rx="3"/><rect class="neutral2" x="830.2" y="116" width="23.2" height="46" rx="3"/><rect class="neutral2" x="830.2" y="168" width="23.2" height="46" rx="3"/><rect class="neutral2" x="855.4" y="116" width="19.6" height="46" rx="3"/><rect class="neutral2" x="855.4" y="168" width="19.6" height="46" rx="3"/><text class="tm" x="24" y="278">Row 4 is approximate (≈): each call's tokens are credited to tool categories (file edit, script, tests…) by the attribution rules in the design doc.</text></svg>
