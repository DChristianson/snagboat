<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 965 770" width="965" height="770" role="img" aria-labelledby="t d">
<title id="t">Goal tracking components</title>
<desc id="d">System, top to bottom. Front ends (VS Code window, Claude Code plugin, CLI, advisor UI) talk to the core over HTTP. The core service has layers: HTTP (ingest and live feed, views and actions, admin and UI, and advisor routes with the report and experiment routes); modules (findings, report, goals, experiments, advisorModels); timers started with setInterval (heuristics, the reports timer, ingest, retention, gitOutcomes); collect (agent event collectors and the git outcomes collector); and storage, every module that writes to the store (events, responses, rules, advisors with proposals, and experiments). On the left, the schema package (packages/schema) gives the core and the front ends their shared types, including Report, Proposal and Experiment; below it, agent logs and the hook script feed the collectors. On the right, advisor sources (a local model and, provisionally, a remote model for advisorModels) and code sources (git repos for the git outcomes collector). The store is ~/.snagboat.</desc>
