<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 584" width="1020" height="584" role="img" aria-labelledby="t d">
<title id="t">Goal tracking data model</title>
<desc id="d">Data model. Agent logs (outside Snagboat) are collected into per-workspace events, rolled up into daily aggregates. In memory the core rebuilds sessions, findings (rules run over events) and discovery candidates. Per workspace it stores finding responses. Per user it stores rules and thresholds, dismissed candidates, advisors, and the new reports, proposals and experiments; an experiment changes a rule or threshold. A new setup conversation, kept as a draft until you accept its proposal, creates an advisor and is kept with it.</desc>
