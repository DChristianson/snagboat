name: Release

# Pushing a tag like v0.0.2 runs the full CI suite, then builds the .vsix and
# the Claude Code plugin's zip, and publishes a GitHub release with both attached. The tag must match the
# version in package.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish the release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tag matches package.json version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match package.json version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Package the extension
        run: npm run package
      - name: Package the Claude Code plugin
        run: npm run package:plugin
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # This version's CHANGELOG.md section, then install steps; GitHub appends the PR list.
          awk -v v="## ${VERSION}" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for ${VERSION}" >&2
            exit 1
          fi
          printf '\nInstall: download `snagboat-%s.vsix` below, then run `code --install-extension snagboat-%s.vsix` and reload your VS Code windows. Requires VS Code 1.145 or later; macOS and Linux only.\n' "$VERSION" "$VERSION" >> notes.md
          printf '\nClaude Code plugin (preview): download `snagboat-claude-plugin-%s.zip` below, then run `claude --plugin-dir snagboat-claude-plugin-%s.zip`. Requires Node.js 24 or later on your PATH.\n' "$VERSION" "$VERSION" >> notes.md
          gh release create "$GITHUB_REF_NAME" "snagboat-${VERSION}.vsix" "snagboat-claude-plugin-${VERSION}.zip" \
            --title "Snagboat ${VERSION}" \
            --generate-notes \
            --notes-file notes.md
