name: Release

# Pushing a tag like v0.0.2 runs the full CI suite, then builds the .vsix and
# publishes a GitHub release with it attached. The tag must match the
# version in package.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish the release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches package.json version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match package.json version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Package the extension
        run: npm run package
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" "snagboat-${VERSION}.vsix" \
            --title "Snagboat ${VERSION}" \
            --generate-notes \
            --notes "Install: download \`snagboat-${VERSION}.vsix\` below, then run \`code --install-extension snagboat-${VERSION}.vsix\` and reload your VS Code windows. Requires VS Code 1.119 or later; macOS and Linux only."
