name: Pages

# Snagboat's Pages site (https://dchristianson.github.io/snagboat/) used to host
# Factory Clock's web page. Factory Clock moved to its own repository
# (https://github.com/DChristianson/factory-clock), so this site now redirects
# to https://dchristianson.github.io/factory-clock/ and old links keep working.
# It deploys the files in pages/: index.html, and the same page as 404.html so
# deep paths redirect too. Nothing is built. The repository's Pages source must
# be set to "GitHub Actions" (Settings > Pages) for the deploy to succeed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits for the running one rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Upload the redirect page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
